<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8a93a6"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4338ca"/></marker>
  </defs>
  <rect width="1280" height="560" rx="24" fill="#f6f7fb"/>

  <!-- Policy + Case -->
  <rect x="40" y="70" width="190" height="96" rx="16" fill="#fff" stroke="#d5d9e6"/>
  <text x="135" y="108" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1729">Policy</text>
  <text x="135" y="134" text-anchor="middle" font-size="14" fill="#5b6478">text · limit · vendors · POs</text>

  <rect x="40" y="250" width="190" height="96" rx="16" fill="#fff" stroke="#d5d9e6"/>
  <text x="135" y="288" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1729">Case</text>
  <text x="135" y="314" text-anchor="middle" font-size="14" fill="#5b6478">amount · vendor · PO · notes</text>

  <!-- Fixed rules -->
  <rect x="300" y="40" width="300" height="360" rx="20" fill="#e8f5fe" stroke="#b6e0f8"/>
  <text x="450" y="76" text-anchor="middle" font-size="18" font-weight="700" fill="#0369a1">FIXED RULES</text>
  <g font-size="16" font-weight="600" fill="#0f1729">
    <rect x="324" y="96" width="252" height="48" rx="12" fill="#fff" stroke="#b6e0f8"/><text x="450" y="126" text-anchor="middle">Parse case</text>
    <rect x="324" y="156" width="252" height="48" rx="12" fill="#fff" stroke="#b6e0f8"/><text x="450" y="186" text-anchor="middle">Spending limit</text>
    <rect x="324" y="216" width="252" height="48" rx="12" fill="#fff" stroke="#b6e0f8"/><text x="450" y="246" text-anchor="middle">PO match · Vendor list</text>
    <rect x="324" y="276" width="252" height="48" rx="12" fill="#fff" stroke="#b6e0f8"/><text x="450" y="306" text-anchor="middle">Bank account on file · Your rules</text>
    <rect x="324" y="336" width="252" height="48" rx="12" fill="#fff" stroke="#b6e0f8"/><text x="450" y="366" text-anchor="middle">Load stored feedback</text>
  </g>

  <!-- Judgment -->
  <rect x="670" y="120" width="280" height="200" rx="20" fill="#f6edff" stroke="#dcc3fb"/>
  <text x="810" y="156" text-anchor="middle" font-size="18" font-weight="700" fill="#6d28d9">AI JUDGMENT</text>
  <rect x="694" y="196" width="232" height="84" rx="12" fill="#fff" stroke="#dcc3fb"/><text x="810" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1729">SERV Reasoning</text><text x="810" y="258" text-anchor="middle" font-size="14" fill="#5b6478">approve or escalate, with a reason</text>

  <!-- Decision -->
  <rect x="1020" y="120" width="220" height="200" rx="20" fill="#e9fbef" stroke="#a9ebc0"/>
  <text x="1130" y="170" text-anchor="middle" font-size="20" font-weight="700" fill="#15803d">Decision</text>
  <text x="1130" y="200" text-anchor="middle" font-size="15" fill="#25304a">approve · deny · escalate</text>
  <text x="1130" y="232" text-anchor="middle" font-size="15" fill="#25304a">with the full path</text>
  <text x="1130" y="264" text-anchor="middle" font-size="15" fill="#25304a">and a plain reason</text>

  <!-- Reppo + History -->
  <rect x="1020" y="400" width="220" height="100" rx="18" fill="#fff" stroke="#d5d9e6"/>
  <text x="1130" y="438" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1729">Reppo score</text>
  <text x="1130" y="466" text-anchor="middle" font-size="14" fill="#5b6478">independent evaluators</text>

  <rect x="670" y="400" width="280" height="100" rx="18" fill="#fff" stroke="#d5d9e6"/>
  <text x="810" y="438" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1729">History</text>
  <text x="810" y="466" text-anchor="middle" font-size="14" fill="#5b6478">runs · paths · scores on disk</text>

  <!-- Arrows -->
  <g stroke="#8a93a6" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <path d="M135 166 V250"/>
    <path d="M230 298 H300"/>
    <path d="M600 220 H670"/>
    <path d="M950 220 H1020"/>
    <path d="M1130 320 V400"/>
    <path d="M1020 450 H950"/>
  </g>
  <g stroke="#4338ca" stroke-width="2.5" fill="none" stroke-dasharray="7 7" marker-end="url(#arrb)">
    <path d="M810 400 V330"/>
    <path d="M670 450 H620 Q450 450 450 400"/>
  </g>
  <text x="640" y="486" font-size="14" font-weight="600" fill="#4338ca">stored score and critique shape the next run</text>
</svg>
